<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>தமிழ்நாடு அரசுப் பாடநூல் — அசல் அச்சுப் பார்வை</title>
  <script src="./vendor/pdfjs/pdf.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Tamil", sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1e293b;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
      z-index: 10;
      flex-wrap: wrap;
      gap: 8px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 1;
      min-width: 0;
    }
    .back-btn {
      background: #0284c7;
      color: #ffffff;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .back-btn:hover { background: #0369a1; }
    .book-title {
      font-size: 14px;
      font-weight: 600;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 480px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s;
    }
    .btn:hover:not(:disabled) { background: #475569; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .page-info {
      font-size: 13px;
      font-weight: 600;
      min-width: 80px;
      text-align: center;
    }
    .jump-input {
      width: 54px;
      background: #0f172a;
      border: 1px solid #475569;
      color: #ffffff;
      padding: 4px 6px;
      border-radius: 4px;
      text-align: center;
      font-size: 13px;
    }
    main {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 10px;
      position: relative;
    }
    #canvasContainer {
      display: flex;
      justify-content: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      overflow: hidden;
      background: #ffffff;
    }
    canvas { display: block; max-width: 100%; height: auto; }
    .nav-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #475569;
      color: #ffffff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      z-index: 20;
      transition: background 0.15s, transform 0.15s;
    }
    .nav-arrow:hover:not(:disabled) {
      background: #0284c7;
      transform: translateY(-50%) scale(1.08);
    }
    .nav-arrow:disabled { opacity: 0.25; cursor: not-allowed; }
    .nav-prev { left: 16px; }
    .nav-next { right: 16px; }
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 30;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a class="back-btn" href="./index.html">← முகப்பு (Home)</a>
      <div class="book-title" id="bookTitle">தமிழ்நாடு அரசுப் பாடநூல்</div>
    </div>
    <div class="controls">
      <button class="btn" id="zoomOutBtn" title="Zoom Out">🔍−</button>
      <button class="btn" id="zoomInBtn" title="Zoom In">🔍+</button>
      <button class="btn" id="fitWidthBtn" title="Fit to Width">↔️ அகலம்</button>
      <div class="page-info">
        பக். <input type="number" id="jumpPageInput" class="jump-input" min="1" value="1"> / <span id="totalPages">1</span>
      </div>
      <button class="btn" id="downloadBtn" title="PDF கோப்பைப் பதிவிறக்கு">⬇️ சேமி</button>
    </div>
  </header>

  <main id="mainViewer">
    <button class="nav-arrow nav-prev" id="prevPageBtn" title="முந்தைய பக்கம் (Previous Page)">‹</button>
    <button class="nav-arrow nav-next" id="nextPageBtn" title="அடுத்த பக்கம் (Next Page)">›</button>

    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div style="font-size:14px;color:#94a3b8;">பாடநூல் பக்கம் ஏற்றப்படுகிறது...</div>
    </div>

    <div id="canvasContainer">
      <canvas id="pdfCanvas"></canvas>
    </div>
  </main>

  <script>
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.js';
    }

    const params = new URLSearchParams(window.location.search);
    const pdfUrl = params.get('pdf') || './books/2026-27/full_year/tamil/pages/page-001.pdf';

    const bookTitleMap = {
      'full_year/tamil': 'வகுப்பு 8 — தமிழ் (முழு ஆண்டு)',
      'full_year/english': 'Class 8 — English (Full Year)',
      'full_year/maths_tm': 'வகுப்பு 8 — கணிதம் (தமிழ் வழி — முழு ஆண்டு)',
      'full_year/maths_em': 'Class 8 — Mathematics (English Medium — Full Year)',
      'full_year/science_tm': 'வகுப்பு 8 — அறிவியல் (தமிழ் வழி — முழு ஆண்டு)',
      'full_year/science_em': 'Class 8 — Science (English Medium — Full Year)',
      'full_year/social_science_tm': 'வகுப்பு 8 — சமூக அறிவியல் (தமிழ் வழி — முழு ஆண்டு)',
      'full_year/social_science_em': 'Class 8 — Social Science (English Medium — Full Year)',
      'legacy-2018-2022/tamil': 'வகுப்பு 8 — தமிழ் (காப்பகம் 2019/2024)',
      'legacy-2018-2022/english': 'Class 8 — English (Archive 2019/2024)',
      'legacy-2018-2022/maths_tm': 'வகுப்பு 8 — கணிதம் (தமிழ் வழி — காப்பகம்)',
      'legacy-2018-2022/maths_em': 'Class 8 — Mathematics (EM — Archive)',
      'legacy-2018-2022/science_tm': 'வகுப்பு 8 — அறிவியல் (தமிழ் வழி — காப்பகம்)',
      'legacy-2018-2022/science_em': 'Class 8 — Science (EM — Archive)',
      'legacy-2018-2022/social_science_tm': 'வகுப்பு 8 — சமூக அறிவியல் (தமிழ் வழி — காப்பகம்)',
      'legacy-2018-2022/social_science_em': 'Class 8 — Social Science (EM — Archive)'
    };

    let detectedTitle = 'தமிழ்நாடு அரசுப் பாடநூல் — வகுப்பு 8';
    for (const [key, title] of Object.entries(bookTitleMap)) {
      if (pdfUrl.includes(key)) {
        detectedTitle = title;
        break;
      }
    }
    document.getElementById('bookTitle').textContent = detectedTitle;
    document.title = detectedTitle + ' — தமிழ்நாடு அரசுப் பாடநூல்கள்';

    let pagesList = [];
    let currentIndex = -1;
    let currentScale = 1.35;
    let pdfDoc = null;

    // Detect book directory and fetch pages.json
    let pagesJsonUrl = null;
    let bookBaseDir = '';
    if (pdfUrl.includes('/pages/')) {
      bookBaseDir = pdfUrl.substring(0, pdfUrl.lastIndexOf('/pages/'));
      pagesJsonUrl = bookBaseDir + '/pages.json';
    }

    if (pagesJsonUrl) {
      fetch(pagesJsonUrl)
        .then(r => r.ok ? r.json() : null)
        .then(list => {
          if (Array.isArray(list)) {
            pagesList = list.map(item => `${bookBaseDir}/${item}`);
            document.getElementById('totalPages').textContent = pagesList.length;
            
            // Find current index
            const norm = p => p.replace(/^(\.\/|\/)/, '');
            currentIndex = pagesList.findIndex(p => norm(p) === norm(pdfUrl));
            if (currentIndex >= 0) {
              document.getElementById('jumpPageInput').value = currentIndex + 1;
            }
            updateNavButtons();
          }
        })
        .catch(() => {});
    }

    function updateNavButtons() {
      const prevBtn = document.getElementById('prevPageBtn');
      const nextBtn = document.getElementById('nextPageBtn');
      if (pagesList.length > 0 && currentIndex >= 0) {
        prevBtn.disabled = (currentIndex <= 0);
        nextBtn.disabled = (currentIndex >= pagesList.length - 1);
      } else {
        prevBtn.disabled = true;
        nextBtn.disabled = true;
      }
    }

    async function renderPage() {
      const loadingOverlay = document.getElementById('loadingOverlay');
      loadingOverlay.classList.remove('hidden');
      try {
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        pdfDoc = await loadingTask.promise;
        const page = await pdfDoc.getPage(1);
        
        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        const viewport = page.getViewport({ scale: currentScale });
        
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        
        await page.render({ canvasContext: ctx, viewport: viewport }).promise;
        loadingOverlay.classList.add('hidden');
      } catch (err) {
        console.error(err);
        loadingOverlay.innerHTML = '<div style="color:#ef4444;font-weight:700;">பக்கம் ஏற்றுவதில் பிழை ஏற்பட்டது.<br><span style="font-size:12px;color:#94a3b8;">' + err.message + '</span></div>';
      }
    }

    function navigateTo(idx) {
      if (idx >= 0 && idx < pagesList.length) {
        window.location.href = `./viewer.html?pdf=${encodeURIComponent(pagesList[idx])}`;
      }
    }

    document.getElementById('prevPageBtn').addEventListener('click', () => {
      if (currentIndex > 0) navigateTo(currentIndex - 1);
    });

    document.getElementById('nextPageBtn').addEventListener('click', () => {
      if (currentIndex >= 0 && currentIndex < pagesList.length - 1) navigateTo(currentIndex + 1);
    });

    document.getElementById('jumpPageInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const pNum = parseInt(e.target.value, 10);
        if (pNum >= 1 && pNum <= pagesList.length) {
          navigateTo(pNum - 1);
        }
      }
    });

    document.getElementById('zoomInBtn').addEventListener('click', () => {
      currentScale += 0.2;
      renderPage();
    });

    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      if (currentScale > 0.6) {
        currentScale -= 0.2;
        renderPage();
      }
    });

    document.getElementById('fitWidthBtn').addEventListener('click', () => {
      currentScale = 1.2;
      renderPage();
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = pdfUrl;
      a.download = pdfUrl.split('/').pop() || 'book_page.pdf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    });

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' && currentIndex > 0) {
        navigateTo(currentIndex - 1);
      } else if (e.key === 'ArrowRight' && currentIndex >= 0 && currentIndex < pagesList.length - 1) {
        navigateTo(currentIndex + 1);
      }
    });

    renderPage();
  </script>
</body>
</html>
